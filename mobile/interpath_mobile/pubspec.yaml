name: interpath_mobile
description: Native Android and iOS app for Interpath Results.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdfrx: ^2.4.7
  permission_handler: ^12.0.3
  share_plus: ^13.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/interpathmed_logo.png

flutter_native_splash:
  color: "#F7F8FC"
  image: assets/images/interpathmed_logo.png
  android_12:
    color: "#F7F8FC"
    image: assets/images/interpathmed_logo.png
    icon_background_color: "#F7F8FC"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/interpathmed_logo.png
  remove_alpha_ios: true
  min_sdk_android: 23
